name: Auto Merge

on:
  workflow_run:
    workflows:
      - 'PR Validation'
      - 'Security & Performance'
      - 'Dependency Review'
      - 'Docker Validation'
    types: [completed]

concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  auto-merge:
    name: Auto Merge
    if: github.event.workflow_run.conclusion == 'success'
    uses: Philippe-arnd/reusable-workflow-vibecoded/.github/workflows/reusable-auto-merge.yml@main
    with:
      required-checks: |
        PR Validation / ✅ Quick Checks
        PR Validation / 🧪 Vitest Tests
        PR Validation / 🔒 RLS Tests
        Security & Performance / 🔑 Secret Detection
        Security & Performance / 🛡️ Security Scan
        Dependency Review / 🔎 Review Dependencies for Vulnerabilities
      merge-method: 'squash'
      base-branch: 'main'
      block-label: 'major-update'
      file-issue-on-failure: true
      triggering-conclusion: ${{ github.event.workflow_run.conclusion }}
      triggering-branch: ${{ github.event.workflow_run.head_branch }}
    permissions:
      contents: write
      pull-requests: write
      checks: read
      issues: write
